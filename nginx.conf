server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip pour de meilleures performances (très utile sur une petite VM)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Routage côté client (React Router, etc.)
    # Redirige toutes les requêtes (salles, 404) vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mise en cache agressive des ressources statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15768000, immutable";
    }
}
